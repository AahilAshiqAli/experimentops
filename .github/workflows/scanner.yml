name: Scanner

on:
  pull_request:
    types: [opened, synchronize, closed]
    branches: [latest]
    paths:
      - services/pom.xml
      - services/libs/**
      - services/applications/scanner/**
      - .github/workflows/java-service-test.yml
      - .github/workflows/java-service-build.yml
      - .github/workflows/scanner.yml

permissions:
  contents: read
  packages: write

jobs:
  test:
    if: github.event.action == 'opened' || github.event.action == 'synchronize'
    uses: ./.github/workflows/java-service-test.yml
    with:
      service-path: applications/scanner
  build-and-push:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    uses: ./.github/workflows/java-service-build.yml
    with:
      service-name: scanner
      service-path: applications/scanner
