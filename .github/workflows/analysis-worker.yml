name: Analysis Worker

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, closed]
    branches: [latest]
    paths:
      - services/applications/python/pyproject.toml
      - services/applications/python/uv.lock
      - services/applications/python/apps/analysis-worker/**
      - services/applications/python/packages/experiment-runtime/**
      - .github/workflows/analysis-worker.yml
      - .github/actions/promote-helm-image/**

permissions:
  contents: write

jobs:
  test:
    if: github.event.action == 'opened' || github.event.action == 'synchronize'
    name: Lint and test analysis worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/applications/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Set up uv and its cache
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --all-groups --all-packages
      - name: Lint Python code
        run: uv run ruff check .
      - name: Run Python tests
        run: uv run pytest apps/analysis-worker/tests packages/experiment-runtime/tests

  build-and-push:
    if: github.event_name == 'workflow_dispatch' || (github.event.action == 'closed' && github.event.pull_request.merged == true)
    name: Build and publish analysis worker
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    concurrency:
      group: local-kind-image-promotion
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ secrets.HELM_PROMOTION_TOKEN }}
      - name: Create lowercase GHCR owner
        id: image
        run: |
          owner="$(tr '[:upper:]' '[:lower:]' <<< "$GITHUB_REPOSITORY_OWNER")"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: services/applications/python
          file: services/applications/python/apps/analysis-worker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.owner }}/experimentops-analysis-worker:sha-${{ github.sha }}
            ghcr.io/${{ steps.image.outputs.owner }}/experimentops-analysis-worker:latest
      - name: Promote image in Helm values
        uses: ./.github/actions/promote-helm-image
        with:
          service-name: analysis-worker
          image-repository: ghcr.io/${{ steps.image.outputs.owner }}/experimentops-analysis-worker
          image-tag: sha-${{ github.sha }}
