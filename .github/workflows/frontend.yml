name: Frontend

on:
  pull_request:
    types: [opened, synchronize, closed]
    branches: [latest]
    paths:
      - services/app/frontend/experimentops-frontend/**
      - .github/workflows/frontend.yml

permissions:
  contents: read

jobs:
  test:
    if: github.event.action == 'opened' || github.event.action == 'synchronize'
    name: Lint and build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/app/frontend/experimentops-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # The frontend does not currently contain a test runner or test files.
      - name: Lint frontend
        run: pnpm lint
      - name: Build frontend
        run: pnpm build

  build-and-push:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    name: Build and publish frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Create lowercase GHCR owner
        id: image
        run: echo "owner=$(echo \"$GITHUB_REPOSITORY_OWNER\" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: services/app/frontend/experimentops-frontend
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.owner }}/experimentops-frontend:sha-${{ github.sha }}
            ghcr.io/${{ steps.image.outputs.owner }}/experimentops-frontend:latest
