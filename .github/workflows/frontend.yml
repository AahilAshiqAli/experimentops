name: Frontend

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, closed]
    branches: [latest]
    paths:
      - services/app/frontend/experimentops-frontend/**
      - .github/workflows/frontend.yml
      - .github/actions/promote-helm-image/**

permissions:
  contents: write

jobs:
  test:
    if: github.event.action == 'opened' || github.event.action == 'synchronize'
    name: Lint and build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/app/frontend/experimentops-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # The frontend does not currently contain a test runner or test files.
      - name: Lint frontend
        run: pnpm lint
      - name: Build frontend
        run: pnpm build

  build-and-push:
    if: github.event_name == 'workflow_dispatch' || (github.event.action == 'closed' && github.event.pull_request.merged == true)
    name: Build and publish frontend
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    concurrency:
      group: local-kind-image-promotion
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ secrets.HELM_PROMOTION_TOKEN }}
      - name: Create lowercase GHCR owner
        id: image
        run: |
          owner="$(tr '[:upper:]' '[:lower:]' <<< "$GITHUB_REPOSITORY_OWNER")"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: services/app/frontend/experimentops-frontend
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.owner }}/experimentops-frontend:sha-${{ github.sha }}
            ghcr.io/${{ steps.image.outputs.owner }}/experimentops-frontend:latest
      - name: Promote image in Helm values
        uses: ./.github/actions/promote-helm-image
        with:
          service-name: frontend
          image-repository: ghcr.io/${{ steps.image.outputs.owner }}/experimentops-frontend
          image-tag: sha-${{ github.sha }}
