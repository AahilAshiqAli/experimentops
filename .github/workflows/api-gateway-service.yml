name: API Gateway Service

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, closed]
    branches: [latest]
    paths:
      - services/pom.xml
      - services/libs/**
      - services/applications/pom.xml
      - services/applications/api-gateway-service/**
      - .github/workflows/java-service-test.yml
      - .github/workflows/java-service-build.yml
      - .github/workflows/api-gateway-service.yml
      - .github/actions/promote-helm-image/**

permissions:
  contents: write
  packages: write

jobs:
  test:
    if: github.event.action == 'opened' || github.event.action == 'synchronize'
    uses: ./.github/workflows/java-service-test.yml
    with:
      service-path: applications/api-gateway-service
  build-and-push:
    if: github.event_name == 'workflow_dispatch' || (github.event.action == 'closed' && github.event.pull_request.merged == true)
    uses: ./.github/workflows/java-service-build.yml
    with:
      service-name: api-gateway-service
      service-path: applications/api-gateway-service
    secrets:
      HELM_PROMOTION_TOKEN: ${{ secrets.HELM_PROMOTION_TOKEN }}
