name: Keycloak Realm Import

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, closed]
    branches: [latest]
    paths:
      - infra/helm/experimentops/keycloak/**
      - .github/workflows/keycloak-realm-import.yml
      - .github/actions/promote-helm-image/**

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    if: github.event_name == 'workflow_dispatch' || (github.event.action == 'closed' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    concurrency:
      group: local-kind-image-promotion
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ secrets.HELM_PROMOTION_TOKEN }}
      - name: Create lowercase GHCR owner
        id: image
        run: |
          owner="$(tr '[:upper:]' '[:lower:]' <<< "$GITHUB_REPOSITORY_OWNER")"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: infra/helm/experimentops/keycloak
          file: infra/helm/experimentops/keycloak/import/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.owner }}/experimentops-keycloak-realm-import:sha-${{ github.sha }}
            ghcr.io/${{ steps.image.outputs.owner }}/experimentops-keycloak-realm-import:latest
      - name: Promote image in Helm values
        uses: ./.github/actions/promote-helm-image
        with:
          service-name: keycloak-realm-import
          image-repository: ghcr.io/${{ steps.image.outputs.owner }}/experimentops-keycloak-realm-import
          image-tag: sha-${{ github.sha }}
          image-target: keycloak-realm-import
