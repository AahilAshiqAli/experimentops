name: Build and publish Java service

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
      service-path:
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services
    steps:
      - name: Check out source code
        uses: actions/checkout@v4
      - name: Create lowercase GHCR owner
        id: image
        run: echo "owner=$(echo \"$GITHUB_REPOSITORY_OWNER\" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Set up Java 21 and Maven cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install the root Maven parent POM
        run: mvn --batch-mode --non-recursive install
      - name: Build shared libraries
        run: mvn --batch-mode --file libs/pom.xml install -DskipTests
      - name: Build application JAR
        run: mvn --batch-mode --projects ${{ inputs.service-path }} package -DskipTests
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: services/${{ inputs.service-path }}
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.owner }}/experimentops-${{ inputs.service-name }}:sha-${{ github.sha }}
            ghcr.io/${{ steps.image.outputs.owner }}/experimentops-${{ inputs.service-name }}:latest
