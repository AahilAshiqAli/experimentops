name: Promote Helm image
description: Update one ExperimentOps image reference and commit the desired state to latest.

inputs:
  service-name:
    description: Name of the deployment entry in the Helm values file.
    required: true
  image-repository:
    description: Fully qualified container-image repository.
    required: true
  image-tag:
    description: Immutable container-image tag to deploy.
    required: true
  target-branch:
    description: Branch Argo CD watches.
    required: false
    default: latest

runs:
  using: composite
  steps:
    - name: Rebase on the current desired state
      shell: bash
      env:
        TARGET_BRANCH: ${{ inputs.target-branch }}
      run: |
        git fetch origin "${TARGET_BRANCH}"
        git rebase "origin/${TARGET_BRANCH}"

    - name: Update desired image
      shell: bash
      env:
        SERVICE_NAME: ${{ inputs.service-name }}
        IMAGE_REPOSITORY: ${{ inputs.image-repository }}
        IMAGE_TAG: ${{ inputs.image-tag }}
      run: |
        perl -0pi -e '
          my $changed = s~(^  - name: \Q$ENV{SERVICE_NAME}\E\n    image: \{[ ]*repository:[ ]*)[^,]+(,[ ]*tag:[ ]*)[^,]+(,[ ]*pullPolicy:[ ]*)[^}]+([ ]*\})~$1 . $ENV{IMAGE_REPOSITORY} . $2 . $ENV{IMAGE_TAG} . $3 . "IfNotPresent" . $4~em;
          die "Expected exactly one deployment image for $ENV{SERVICE_NAME}, updated $changed\n" unless $changed == 1;
        ' infra/helm/experimentops/values.yaml

    - name: Commit desired state
      shell: bash
      env:
        SERVICE_NAME: ${{ inputs.service-name }}
        IMAGE_TAG: ${{ inputs.image-tag }}
        TARGET_BRANCH: ${{ inputs.target-branch }}
      run: |
        git config user.name "experimentops-deploy[bot]"
        git config user.email "experimentops-deploy[bot]@users.noreply.github.com"
        git add infra/helm/experimentops/values.yaml
        if git diff --cached --quiet; then
          echo "Helm values already reference ${IMAGE_TAG}; nothing to promote."
          exit 0
        fi
        git commit -m "deploy(${SERVICE_NAME}): ${IMAGE_TAG}"
        git pull --rebase origin "${TARGET_BRANCH}"
        git push origin "HEAD:${TARGET_BRANCH}"
