apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: experimentops-local
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/AahilAshiqAli/experimentops.git
    targetRevision: latest
    path: infra/helm/experimentops
    helm:
      releaseName: experimentops
      valueFiles:
        - sealed-secrets.values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: experimentops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
