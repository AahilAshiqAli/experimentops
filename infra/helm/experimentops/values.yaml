configMaps:
  - name: platform-api-config
    app: platform-api
    data:
      SERVER_PORT: "8080"
      EXPERIMENTOPS_PORTAL_URL: "{{ if .Values.ingress.tls.enabled }}https{{ else }}http{{ end }}://{{ .Values.ingress.frontendHost }}"
      EXPERIMENTOPS_DB_HOST: host.docker.internal
      EXPERIMENTOPS_DB_PORT: "55118"
      EXPERIMENTOPS_DB_SCHEMA: experimentOps
      EXPERIMENTOPS_DB_USERNAME: experimentops_user
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_MASTER_REALM: master
      KEYCLOAK_MASTER_USERNAME: admin
      KEYCLOAK_MASTER_CLIENT_ID: admin-cli
      EXPERIMENTOPS_MAIL_HOST: mailpit
      EXPERIMENTOPS_MAIL_PORT: "1025"
      EXPERIMENTOPS_MAIL_FROM: no-reply@experimentops.local
      EXPERIMENTOPS_MAIL_AUTH: "false"
      EXPERIMENTOPS_MAIL_SSL: "false"
      EXPERIMENTOPS_MAIL_START_TLS: "false"
  - name: api-gateway-service-config
    app: api-gateway-service
    data:
      SERVER_PORT: "8080"
      SERVICES_PLATFORM_API_URL: http://platform-api:8080
      JWT_CLIENT_ID: experimentops-web
      CORS_ALLOWED_ORIGINS: "*"
  - name: scanner-config
    app: scanner
    data:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      DATASET_SCAN_MAX_FILE_SIZE_BYTES: "52428800"
  - name: analysis-worker-config
    app: analysis-worker
    data:
      EXPERIMENTOPS_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EXPERIMENTOPS_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      EXPERIMENTOPS_KAFKA_TOPICS: experiment-run-requested-topic
      EXPERIMENTOPS_KAFKA_CONSUMER_GROUP_ID: experimentops-analysis-worker
      EXPERIMENTOPS_KAFKA_AUTO_OFFSET_RESET: earliest
      EXPERIMENTOPS_KAFKA_ENABLE_AUTO_COMMIT: "false"
      EXPERIMENTOPS_KAFKA_MAX_POLL_INTERVAL_MS: "900000"
  - name: kafka-config
    app: kafka
    data:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-0.kafka-headless:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      CLUSTER_ID: experimentops-local-cluster
  - name: keycloak-config
    app: keycloak
    data:
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
  - name: schema-registry-config
    app: schema-registry
    data:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
deployments:
  - name: platform-api
    image: {repository: ghcr.io/aahilashiqali/experimentops-platform-api, tag: sha-3a06409b9867b12ad1798af04a6133cf8aabada2, pullPolicy: IfNotPresent}
    port: {name: http, containerPort: 8080}
    configMaps: [platform-api-config]
    secrets: [experimentops-runtime-secrets, platform-api-secrets]
    startupProbe: {path: /actuator/health/liveness, initialDelaySeconds: 10, periodSeconds: 5, timeoutSeconds: 3, failureThreshold: 48}
    readinessProbe: {path: /actuator/health/readiness, initialDelaySeconds: 30, periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 3}
    livenessProbe: {path: /actuator/health/liveness, initialDelaySeconds: 60, periodSeconds: 20, timeoutSeconds: 3, failureThreshold: 3}
    resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "1", memory: 1Gi}}
  - name: api-gateway-service
    image: {repository: ghcr.io/aahilashiqali/experimentops-api-gateway-service, tag: sha-371564588a5ca79a28f6df3a91cf0166db983cbf, pullPolicy: IfNotPresent}
    port: {name: http, containerPort: 8080}
    configMaps: [api-gateway-service-config]
    secrets: [api-gateway-service-secrets]
    readinessProbe: {path: /actuator/health/readiness, initialDelaySeconds: 20, periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 6}
    livenessProbe: {path: /actuator/health/liveness, initialDelaySeconds: 45, periodSeconds: 20, timeoutSeconds: 3, failureThreshold: 3}
    resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "1", memory: 1Gi}}
  - name: frontend
    image: {repository: ghcr.io/aahilashiqali/experimentops-frontend, tag: sha-371564588a5ca79a28f6df3a91cf0166db983cbf, pullPolicy: IfNotPresent}
    port: {name: http, containerPort: 80}
    readinessProbe: {path: /, initialDelaySeconds: 5, periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 3}
    livenessProbe: {path: /, initialDelaySeconds: 15, periodSeconds: 20, timeoutSeconds: 3, failureThreshold: 3}
    resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 250m, memory: 256Mi}}
  - name: scanner
    image: {repository: ghcr.io/aahilashiqali/experimentops-scanner, tag: sha-2bcb7df4153f162485498aadc8df8a1f337b611f, pullPolicy: IfNotPresent}
    configMaps: [scanner-config]
    secrets: [experimentops-runtime-secrets]
    terminationGracePeriodSeconds: 60
    resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "1", memory: 1Gi}}
  - name: analysis-worker
    image: {repository: ghcr.io/aahilashiqali/experimentops-analysis-worker, tag: sha-2be7d80fff190fda88f919946368244039a0050c, pullPolicy: IfNotPresent}
    configMaps: [analysis-worker-config]
    secrets: [experimentops-runtime-secrets]
    terminationGracePeriodSeconds: 120
    fieldRefEnv: {EXPERIMENTOPS_KAFKA_CLIENT_ID: metadata.name}
    resources: {requests: {cpu: 500m, memory: 1Gi}, limits: {cpu: "2", memory: 4Gi}}
  - name: schema-registry
    image: {repository: confluentinc/cp-schema-registry, tag: 7.7.1, pullPolicy: IfNotPresent}
    port: {name: http, containerPort: 8081}
    configMaps: [schema-registry-config]
    enableServiceLinks: false
    readinessProbe: {path: /subjects, initialDelaySeconds: 20, periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 6}
    livenessProbe: {path: /subjects, initialDelaySeconds: 60, periodSeconds: 20, timeoutSeconds: 3, failureThreshold: 3}
    resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: 500m, memory: 1Gi}}
  - name: mailpit
    image: {repository: axllent/mailpit, tag: latest, pullPolicy: IfNotPresent}
    ports: [{name: smtp, containerPort: 1025}, {name: web, containerPort: 8025}]
    readinessProbe: {path: /, port: web, initialDelaySeconds: 5, periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 3}
    livenessProbe: {path: /, port: web, initialDelaySeconds: 15, periodSeconds: 20, timeoutSeconds: 3, failureThreshold: 3}
    resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 250m, memory: 256Mi}}
services:
  - {name: platform-api, app: platform-api, port: 8080, targetPort: http}
  - {name: api-gateway-service, app: api-gateway-service, port: 8080, targetPort: http}
  - {name: frontend, app: frontend, port: 80, targetPort: http}
  - {name: schema-registry, app: schema-registry, port: 8081, targetPort: http}
  - {name: mailpit, app: mailpit, ports: [{name: smtp, port: 1025, targetPort: smtp}, {name: web, port: 8025, targetPort: web}]}
kafka:
  image: {repository: confluentinc/cp-kafka, tag: 7.7.1, pullPolicy: IfNotPresent}
  replicas: 1
  persistence: {size: 2Gi, storageClassName: ""}
  resources: {requests: {cpu: 500m, memory: 1Gi}, limits: {cpu: "1", memory: 2Gi}}
keycloak:
  image: {repository: quay.io/keycloak/keycloak, tag: 25.0.6, pullPolicy: IfNotPresent}
  realmImportImage: {repository: keycloak-realm-import, tag: local, pullPolicy: IfNotPresent}
  replicas: 1
  persistence: {size: 1Gi, storageClassName: ""}
  resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "1", memory: 1Gi}}
ingress:
  enabled: true
  className: nginx
  frontendHost: experimentops.test
  apiHost: api.experimentops.test
  tls:
    enabled: true
    secretName: experimentops-local-tls
