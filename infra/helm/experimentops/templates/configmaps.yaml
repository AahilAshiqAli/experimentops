{{- range $configMap := .Values.configMaps }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $configMap.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "experimentops.appLabels" $configMap.app | nindent 4 }}
data:
  {{- range $key, $value := $configMap.data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
---
{{- end }}
