{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: experimentops
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "experimentops.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.frontendHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: frontend, port: { number: 80 } } }
    - host: {{ .Values.ingress.apiHost }}
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend: { service: { name: api-gateway-service, port: { number: 8080 } } }
{{- end }}
