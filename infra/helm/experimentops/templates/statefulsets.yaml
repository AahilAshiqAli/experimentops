apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: kafka }
  ports: [{ name: kafka, port: 9092, targetPort: kafka }]
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: {{ .Release.Namespace }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: { app.kubernetes.io/name: kafka }
  ports: [{ name: kafka, port: 9092, targetPort: kafka }, { name: controller, port: 9093, targetPort: controller }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: {{ .Release.Namespace }}
spec:
  serviceName: kafka-headless
  replicas: {{ .Values.kafka.replicas }}
  selector: { matchLabels: { app.kubernetes.io/name: kafka } }
  template:
    metadata: { labels: { app.kubernetes.io/name: kafka, app.kubernetes.io/part-of: experimentops } }
    spec:
      enableServiceLinks: false
      containers:
        - name: kafka
          image: {{ .Values.kafka.image.repository }}:{{ .Values.kafka.image.tag }}
          imagePullPolicy: {{ .Values.kafka.image.pullPolicy }}
          ports: [{ name: kafka, containerPort: 9092 }, { name: controller, containerPort: 9093 }]
          envFrom: [{ configMapRef: { name: kafka-config } }]
          env: [{ name: KAFKA_PORT, value: "" }]
          volumeMounts: [{ name: data, mountPath: /var/lib/kafka/data }]
          readinessProbe: { tcpSocket: { port: kafka }, initialDelaySeconds: 20, periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 6 }
          livenessProbe: { tcpSocket: { port: kafka }, initialDelaySeconds: 60, periodSeconds: 20, timeoutSeconds: 3, failureThreshold: 3 }
          resources: {{- toYaml .Values.kafka.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.kafka.persistence.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.kafka.persistence.size }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: keycloak }
  ports: [{ name: http, port: 8080, targetPort: http }, { name: management, port: 9000, targetPort: management }]
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-headless
  namespace: {{ .Release.Namespace }}
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: keycloak }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak
  namespace: {{ .Release.Namespace }}
spec:
  serviceName: keycloak-headless
  replicas: {{ .Values.keycloak.replicas }}
  selector: { matchLabels: { app.kubernetes.io/name: keycloak } }
  template:
    metadata: { labels: { app.kubernetes.io/name: keycloak, app.kubernetes.io/part-of: experimentops } }
    spec:
      initContainers:
        - name: copy-realm-import
          image: {{ .Values.keycloak.realmImportImage.repository }}:{{ .Values.keycloak.realmImportImage.tag }}
          imagePullPolicy: {{ .Values.keycloak.realmImportImage.pullPolicy }}
          command: [sh, -c, cp -a /realm-import/. /realm-import-target/]
          volumeMounts: [{ name: realm-import, mountPath: /realm-import-target }]
      containers:
        - name: keycloak
          image: {{ .Values.keycloak.image.repository }}:{{ .Values.keycloak.image.tag }}
          imagePullPolicy: {{ .Values.keycloak.image.pullPolicy }}
          args: [start-dev, --import-realm]
          ports: [{ name: http, containerPort: 8080 }, { name: management, containerPort: 9000 }]
          envFrom: [{ configMapRef: { name: keycloak-config } }, { secretRef: { name: keycloak-secrets } }]
          volumeMounts: [{ name: data, mountPath: /opt/keycloak/data }, { name: realm-import, mountPath: /opt/keycloak/data/import }]
          readinessProbe: { httpGet: { path: /health/ready, port: management }, initialDelaySeconds: 30, periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 6 }
          livenessProbe: { httpGet: { path: /health/live, port: management }, initialDelaySeconds: 60, periodSeconds: 20, timeoutSeconds: 3, failureThreshold: 3 }
          resources: {{- toYaml .Values.keycloak.resources | nindent 12 }}
      volumes: [{ name: realm-import, emptyDir: {} }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.keycloak.persistence.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.keycloak.persistence.size }} } }
