# Purpose: Define the analysis-worker package, runtime dependencies, and executable entry point.

[project]
name = "analysis-worker"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "experiment-runtime[s3]",
    "joblib>=1.4.0",
    "pandas>=3.0.3",
    "scikit-learn>=1.7.0,<2.0",
]

[project.scripts]
analysis-worker = "analysis_worker.main:main"

[tool.uv.sources]
experiment-runtime = { workspace = true }

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
