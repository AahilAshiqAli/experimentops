# Info endpoint properties
info.app.name=@project.name@
info.app.description=ExperimentOps platform API for managing experiments, configurations, runs, and results
info.app.version=@project.version@
info.build.artifact=@project.artifactId@
info.build.name=@project.build.finalName@
info.build.version=@project.version@

project.artifactId=@project.artifactId@
project.name=@project.name@
project.version=@project.version@
project.description=ExperimentOps platform backend

# Logging
logging.pattern.console=%d{${LOG_DATEFORMAT_PATTERN:yyyy-MM-dd HH:mm:ss.SSS}} %clr(%-5level) %highlight([${project.name}]) %-50logger : %msg%n%throwable
logging.level.org.springframework=INFO
logging.level.com.experimentops=DEBUG

# Server
server.port=${SERVER_PORT:8080}
server.max-http-request-header-size=20KB
spring.main.banner-mode=off
spring.codec.max-in-memory-size=20MB

# Database / MySQL
spring.datasource.url=jdbc:mysql://${experimentops.db.host:localhost}:${experimentops.db.port:55000}/${experimentops.db.schema:experimentOps}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${experimentops.db.username:experimentops_user}
spring.datasource.password=${experimentops.db.password:experimentops_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hikari connection pool
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Kafka basic connection properties
spring.kafka.bootstrap-servers=${kafka.bootstrap-servers:localhost:9092}
spring.kafka.properties.schema.registry.url=${kafka.schema.registry-url:http://localhost:8081}
spring.kafka.properties.specific.avro.reader=true

spring.kafka.consumer.group-id=${kafka.consumer.group-id:experimentops-platform-api}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.properties.spring.deserializer.value.delegate.class=io.confluent.kafka.serializers.KafkaAvroDeserializer

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer

kafka.consumer.max.retries=3
kafka.consumer.retry.interval=10000

# External internal services
experimentops.analysis-api.base-url=${experimentops.analysis-api.base-url:http://localhost:8000}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Request logging exclusions
request.logging.filter.path.disable=/actuator/prometheus,/actuator/health,/actuator/info

# KeyCloak
experimentops.keycloak.master.server-url=${KEYCLOAK_SERVER_URL}
experimentops.keycloak.auth.token-url=${KEYCLOAK_SERVER_URL}/realms/{realmName}/protocol/openid-connect/token
experimentops.keycloak.master.realm=${KEYCLOAK_MASTER_REALM}
experimentops.keycloak.master.username=${KEYCLOAK_MASTER_USERNAME}
experimentops.keycloak.master.password=${KEYCLOAK_MASTER_PASSWORD}
experimentops.keycloak.master.client-id=${KEYCLOAK_MASTER_CLIENT_ID}
experimentops.keycloak.admin-client.connection-pool-size=${KEYCLOAK_ADMIN_CLIENT_CONNECTION_POOL_SIZE:10}
kc.smtp.mail.host=${KEYCLOAK_SMTP_MAIL_HOST:localhost}
kc.smtp.mail.port=${KEYCLOAK_SMTP_MAIL_PORT:1025}
kc.smtp.mail.from=${KEYCLOAK_SMTP_MAIL_FROM:no-reply@experimentops.local}
kc.smtp.mail.auth=${KEYCLOAK_SMTP_MAIL_AUTH:false}
kc.smtp.mail.user=${KEYCLOAK_SMTP_MAIL_USER:}
kc.smtp.mail.password=${KEYCLOAK_SMTP_MAIL_PASSWORD:}
kc.smtp.mail.ssl=${KEYCLOAK_SMTP_MAIL_SSL:false}
kc.smtp.mail.start.tls=${KEYCLOAK_SMTP_MAIL_START_TLS:false}
workspace.config.server.rsa-key=${WORKSPACE_CONFIG_SERVER_RSA_KEY:}
keycloak.password.policy.length=${KEYCLOAK_PASSWORD_POLICY_LENGTH:8}
keycloak.password.policy.specialChars=${KEYCLOAK_PASSWORD_POLICY_SPECIAL_CHARS:1}
keycloak.password.policy.digits=${KEYCLOAK_PASSWORD_POLICY_DIGITS:1}
keycloak.password.policy.expiryDays=${KEYCLOAK_PASSWORD_POLICY_EXPIRY_DAYS:90}
keycloak.password.policy.history=${KEYCLOAK_PASSWORD_POLICY_HISTORY:3}
user.forgot.password.expiry=${USER_FORGOT_PASSWORD_EXPIRY:300}
experimentops.portal.url=${EXPERIMENTOPS_PORTAL_URL:http://localhost:3000}

# Email
experimentops.mail.host=${EXPERIMENTOPS_MAIL_HOST:${KEYCLOAK_SMTP_MAIL_HOST:localhost}}
experimentops.mail.port=${EXPERIMENTOPS_MAIL_PORT:${KEYCLOAK_SMTP_MAIL_PORT:1025}}
experimentops.mail.from=${EXPERIMENTOPS_MAIL_FROM:${KEYCLOAK_SMTP_MAIL_FROM:no-reply@experimentops.local}}
experimentops.mail.username=${EXPERIMENTOPS_MAIL_USERNAME:${KEYCLOAK_SMTP_MAIL_USER:}}
experimentops.mail.password=${EXPERIMENTOPS_MAIL_PASSWORD:${KEYCLOAK_SMTP_MAIL_PASSWORD:}}
experimentops.mail.auth=${EXPERIMENTOPS_MAIL_AUTH:${KEYCLOAK_SMTP_MAIL_AUTH:false}}
experimentops.mail.ssl=${EXPERIMENTOPS_MAIL_SSL:${KEYCLOAK_SMTP_MAIL_SSL:false}}
experimentops.mail.start-tls=${EXPERIMENTOPS_MAIL_START_TLS:${KEYCLOAK_SMTP_MAIL_START_TLS:false}}

# AWS Creds
experimentops.storage.s3.bucket=${EXPERIMENTOPS_STORAGE_S3_BUCKET}
experimentops.storage.s3.region=${EXPERIMENTOPS_STORAGE_S3_REGION}

# Kafka topics
workspace.topic.name=workspace-topic
user.topic.name=user-topic
notification.topic.name=notification-topic-name
notification.dlt.topic.name=notification-topic-name.DLT
user.topic.group-id=user-group-id
workspace.topic.group-id=workspace-group-id
notification.group.id=notification-group-id

# Security
# Comma-separated regex/contains patterns that should be treated as INTERNAL instead of user-token authenticated.
experimentops.security.internal-authenticated-paths=
