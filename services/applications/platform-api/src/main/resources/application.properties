# Info endpoint properties
info.app.name=@project.name@
info.app.description=ExperimentOps platform API for managing experiments, configurations, runs, and results
info.app.version=@project.version@
info.build.artifact=@project.artifactId@
info.build.name=@project.build.finalName@
info.build.version=@project.version@

project.artifactId=@project.artifactId@
project.name=@project.name@
project.version=@project.version@
project.description=ExperimentOps platform backend

# Logging
logging.pattern.console=%d{${LOG_DATEFORMAT_PATTERN:yyyy-MM-dd HH:mm:ss.SSS}} %clr(%-5level) %highlight([${project.name}]) %-50logger : %msg%n%throwable
logging.level.org.springframework=INFO
logging.level.com.experimentops=DEBUG

# Server
server.port=${SERVER_PORT:8080}
server.max-http-request-header-size=20KB
spring.main.banner-mode=off
spring.codec.max-in-memory-size=20MB

# Database / MySQL
spring.datasource.url=jdbc:mysql://${experimentops.db.host:localhost}:${experimentops.db.port:55000}/${experimentops.db.schema:experimentOps}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${experimentops.db.username:experimentops_user}
spring.datasource.password=${experimentops.db.password:experimentops_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hikari connection pool
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Kafka basic connection properties
spring.kafka.bootstrap-servers=${kafka.bootstrap-servers:localhost:9092}
spring.kafka.properties.schema.registry.url=${kafka.schema.registry-url:http://localhost:8081}
spring.kafka.properties.specific.avro.reader=true

spring.kafka.consumer.group-id=${kafka.consumer.group-id:experimentops-platform-api}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.properties.spring.deserializer.value.delegate.class=io.confluent.kafka.serializers.KafkaAvroDeserializer

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer

kafka.consumer.max.retries=3
kafka.consumer.retry.interval=10000

# External internal services
experimentops.analysis-api.base-url=${experimentops.analysis-api.base-url:http://localhost:8000}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Request logging exclusions
request.logging.filter.path.disable=/actuator/prometheus,/actuator/health,/actuator/info