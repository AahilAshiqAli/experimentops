# JPA - schema managed manually via schema.sql (@Sql); no Hibernate DDL
spring.jpa.hibernate.ddl-auto=none

# Kafka - fake values so auto-config initialises without a real broker (KafkaProducer is @MockBean in tests)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.properties.schema.registry.url=http://localhost:8081

# Keycloak - override env-var-only properties so the context starts without real env vars (KeyCloakGateway is @MockBean)
experimentops.keycloak.master.server-url=http://localhost:8180
experimentops.keycloak.master.realm=test-master
experimentops.keycloak.master.username=test-admin
experimentops.keycloak.master.password=test-password
experimentops.keycloak.master.client-id=admin-cli
keycloak.realm=test-master
keycloak.auth-server-url=http://localhost:8180
keycloak.resource=admin-cli
