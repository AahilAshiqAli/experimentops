info:
  app.name: '@project.name@'
  build:
    artifact: '@project.artifactId@'
    name: '@project.build.finalName@'
    version: '@project.version@'

server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: api-gateway-service
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: ${cors.allowed-origins:*}
                allowed-headers: "*"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                  - PATCH
                  - HEAD
            add-to-simple-url-handler-mapping: true
          routes:
            - id: platform_api
              uri: ${services.platform-api.url:http://localhost:8080}
              predicates:
                - Path=/v1/**
              metadata:
                response-timeout: 30000
                connect-timeout: 30000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

jwks:
  certs: ${JWKS_CERTS:}
  certs-file: ${JWKS_CERTS_FILE:}
  clock:
    skew:
      seconds: ${JWKS_CLOCK_SKEW_SECONDS:30}
  client-id: ${JWT_CLIENT_ID}
