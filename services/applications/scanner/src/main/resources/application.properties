# Logging
project.name=scanner
logging.pattern.console=%d{${LOG_DATEFORMAT_PATTERN:yyyy-MM-dd HH:mm:ss.SSS}} %clr(%-5level) %highlight([${project.name}]) %-50logger : %msg%n%throwable
logging.level.org.springframework=INFO
logging.level.com.experimentops=DEBUG
spring.main.web-application-type=none

# Storage
experimentops.storage.s3.bucket=${EXPERIMENTOPS_STORAGE_S3_BUCKET}
experimentops.storage.s3.region=${EXPERIMENTOPS_STORAGE_S3_REGION}
experimentops.storage.s3.presigned-upload-expiration-minutes=${EXPERIMENTOPS_STORAGE_S3_PRESIGNED_UPLOAD_EXPIRATION_MINUTES:15}
dataset.scan.max-file-size-bytes=${DATASET_SCAN_MAX_FILE_SIZE_BYTES:52428800}

# Kafka
spring.kafka.bootstrap-servers=${kafka.bootstrap-servers:localhost:9092}
spring.kafka.properties.schema.registry.url=${kafka.schema.registry-url:http://localhost:8081}
spring.kafka.properties.specific.avro.reader=true
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.properties.spring.deserializer.value.delegate.class=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
kafka.consumer.max.retries=3
kafka.consumer.retry.interval=10000

dataset.version.scan.requested.topic=dataset-version-scan-requested-topic
dataset.version.scan.requested.topic.group-id=dataset-version-scan-requested-group-id
dataset.version.scan.completed.topic=dataset-version-scan-completed-topic

