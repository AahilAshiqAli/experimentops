server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # The browser cannot resolve Kubernetes Service names. Keep frontend API
  # calls same-origin and forward them to the in-cluster API Gateway instead.
  location /v1/ {
    proxy_pass http://api-gateway-service:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Return the Vite SPA entry point for client-side routes such as /projects.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
