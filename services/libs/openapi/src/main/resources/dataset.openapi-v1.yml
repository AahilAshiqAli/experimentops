openapi: 3.0.1

info:
  title: ExperimentOps
  description: ExperimentOps API.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1
    description: Local
    variables:
      basePath:
        default: api/v1

tags:
  - name: Dataset
    description: Everything about dataset

paths:
  /project/{projectUuid}/dataset:
    post:
      summary: Add Dataset
      description: This API will add dataset.
      tags:
        - Dataset
      operationId: addDataset
      parameters:
        - name: projectUuid
          in: path
          description: Project uuid
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetRequestModel'
      responses:
        202:
          description: Dataset create event published successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetResponseModel'
    get:
      summary: Get Dataset List
      description: This API will get all datasets for a project.
      tags:
        - Dataset
      operationId: getDatasetList
      parameters:
        - name: projectUuid
          in: path
          description: Project uuid
          required: true
          schema:
            type: string
        - name: page
          in: query
          description: Zero-based page index
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          description: Number of entries to return
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 20
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetListResponseModel'

  /project/{projectUuid}/dataset/{uuid}:
    get:
      summary: Get Dataset
      description: This API will get dataset with all versions.
      tags:
        - Dataset
      operationId: getDataset
      parameters:
        - name: projectUuid
          in: path
          description: Project uuid
          required: true
          schema:
            type: string
        - name: uuid
          in: path
          description: Dataset uuid
          required: true
          schema:
            type: string
        - name: page
          in: query
          description: Zero-based page index for dataset versions
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          description: Number of dataset versions to return
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 20
        - name: scanStatus
          in: query
          description: Dataset version scan status filter
          required: false
          schema:
            type: string
            enum:
              - NOT_STARTED
              - PENDING
              - IN_PROGRESS
              - COMPLETED
              - FAILED
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetDetailResponseModel'
    put:
      summary: Update Dataset
      description: This API will update dataset.
      tags:
        - Dataset
      operationId: updateDataset
      parameters:
        - name: projectUuid
          in: path
          description: Project uuid
          required: true
          schema:
            type: string
        - name: uuid
          in: path
          description: Dataset uuid
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetRequestModel'
      responses:
        202:
          description: Dataset update event published successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetResponseModel'
    patch:
      summary: Change Status of Dataset
      description: This API will change status of dataset.
      tags:
        - Dataset
      operationId: updateStatusDataset
      parameters:
        - name: projectUuid
          in: path
          description: Project uuid
          required: true
          schema:
            type: string
        - name: uuid
          in: path
          description: Dataset uuid
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetStatusChangeRequestModel'
      responses:
        202:
          description: Dataset status change event published successfully

  /dataset/{datasetUuid}/version:
    post:
      summary: Initiate Dataset Version Upload
      description: Publishes creation of a pending dataset version and returns a presigned URL for uploading its file.
      tags:
        - Dataset
      operationId: initiateDatasetVersionUpload
      parameters:
        - name: datasetUuid
          in: path
          description: Dataset uuid
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetVersionUploadRequestModel'
      responses:
        200:
          description: Dataset version upload initiated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetVersionResponseModel'

  /dataset/{datasetUuid}/version/{uuid}:
    get:
      summary: Get Dataset Version
      description: This API will download dataset version file.
      tags:
        - Dataset
      operationId: getDatasetVersion
      parameters:
        - name: datasetUuid
          in: path
          description: Dataset uuid
          required: true
          schema:
            type: string
        - name: uuid
          in: path
          description: Dataset version uuid
          required: true
          schema:
            type: string
      responses:
        200:
          description: successful operation
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
    patch:
      summary: Change Status of Dataset Version
      description: This API will change status of dataset version.
      tags:
        - Dataset
      operationId: updateStatusDatasetVersion
      parameters:
        - name: datasetUuid
          in: path
          description: Dataset uuid
          required: true
          schema:
            type: string
        - name: uuid
          in: path
          description: Dataset version uuid
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetVersionStatusChangeRequestModel'
      responses:
        200:
          description: Dataset version status changed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetVersionItemModel'

components:
  schemas:
    DatasetListResponseModel:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DatasetResponseModel'
        totalElements:
          type: integer
          format: int64
          example: 123
    DatasetResponseModel:
      type: object
      properties:
        datasetUuid:
          type: string
          example: "9f5c8c9a-8d5f-4a41-8cb4-6c8b3b5d12a1"
        name:
          type: string
          example: "training-data"
        projectUuid:
          type: string
          example: "9f5c8c9a-8d5f-4a41-8cb4-6c8b3b5d12a1"
        status:
          type: string
          example: "ACTIVE"
        versionCount:
          type: integer
          example: 2
        updatedAt:
          type: string
          example: "2026-06-11T10:30:00"
    DatasetRequestModel:
      type: object
      properties:
        name:
          type: string
          example: "training-data"
    DatasetStatusChangeRequestModel:
      type: object
      properties:
        status:
          type: string
          example: "ACTIVE"
    DatasetDetailResponseModel:
      type: object
      properties:
        datasetUuid:
          type: string
          example: "9f5c8c9a-8d5f-4a41-8cb4-6c8b3b5d12a1"
        projectUuid:
          type: string
          example: "9f5c8c9a-8d5f-4a41-8cb4-6c8b3b5d12a1"
        name:
          type: string
          example: "Pun Detection Main Dataset"
        versions:
          type: array
          items:
            $ref: '#/components/schemas/DatasetVersionItemModel'
        totalElements:
          type: integer
          format: int64
          example: 123
    DatasetVersionItemModel:
      type: object
      properties:
        datasetVersionUuid:
          type: string
          example: "9f5c8c9a-8d5f-4a41-8cb4-6c8b3b5d12a1"
        originalFileName:
          type: string
          example: "pun_dataset_v1.csv"
        format:
          type: string
          enum:
            - CSV
            - EXCEL
            - TEXT
            - UNKNOWN
          example: "CSV"
        size:
          type: integer
          format: int64
          example: 102400
        scanStatus:
          type: string
          example: "NOT_STARTED"
        scanMessage:
          type: string
          example: "Successful"
        updatedAt:
          type: string
          example: "2026-06-11T10:40:00"
        status:
          type: string
          example: "ACTIVE"
    DatasetVersionStatusChangeRequestModel:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ACTIVE
            - FAILED
          example: "ACTIVE"
        failureMessage:
          type: string
          maxLength: 1000
          description: Required when status is FAILED.
    DatasetVersionResponseModel:
      type: object
      required:
        - uuid
        - uploadUrl
        - expiresAt
        - method
      properties:
        uuid:
          type: string
          example: "9f5c8c9a-8d5f-4a41-8cb4-6c8b3b5d12a1"
        uploadUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
        method:
          type: string
          example: "PUT"
        requiredHeaders:
          type: object
          additionalProperties:
            type: string
    DatasetVersionUploadRequestModel:
      type: object
      required:
        - fileName
      properties:
        fileName:
          type: string
          minLength: 1
          example: "training-data.csv"
