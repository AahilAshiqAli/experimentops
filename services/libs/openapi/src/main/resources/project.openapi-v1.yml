openapi: 3.0.1

info:
  title: ExperimentOps
  description: ExperimentOps API.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1
    description: Local
    variables:
      basePath:
        default: api/v1

tags:
  - name: Project
    description: Everything about project


paths:
  /project:
    post:
      summary: Add Project
      description: This API will add project.
      tags:
        - Project
      operationId: addProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectRequestModel'
      responses:
        202:
          description: Project create event published successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponseModel'
    get:
      summary: Get Project List
      description: This API will get project list.
      tags:
        - Project
      operationId: getProjectList
      parameters:
        - name: page
          in: query
          description: Zero-based page index
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          description: Number of entries to return
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 20
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponseModel'

  /project/{uuid}:
    get:
      summary: Get Project
      description: This API will get project.
      tags:
        - Project
      operationId: getProject
      parameters:
        - name: uuid
          in: path
          description: Project uuid
          required: true
          schema:
            type: string
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectSummaryResponseModel'

    put:
      summary: Update Project
      description: This API will update project.
      tags:
        - Project
      operationId: updateProject
      parameters:
        - name: uuid
          in: path
          description: Project uuid
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectRequestModel'
      responses:
        202:
          description: Project update event published successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponseModel'
    patch:
      summary: Change Status of Project
      description: This API will change status of project.
      tags:
        - Project
      operationId: updateStatusProject
      parameters:
        - name: uuid
          in: path
          description: Project uuid
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectStatusChangeRequestModel'
      responses:
        202:
          description: Project status change event published successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponseModel'



components:
  schemas:
    ProjectListResponseModel:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProjectResponseModel'
        totalElements:
          type: integer
          format: int64
          example: 123
    ProjectResponseModel:
      type: object
      properties:
        uuid:
          type: string
          example: "9f5c8c9a-8d5f-4a41-8cb4-6c8b3b5d12a1"
        name:
          type: string
          example: "Project-1"
        description:
          type: string
          example: "Project about Data Cleaning"
        creationDate:
          type: string
    ProjectRequestModel:
      type: object
      properties:
        name:
          type: string
          example: "Project-1"
        description:
          type: string
          example: "Project about Data Cleaning"
    ProjectSummaryResponseModel:
      type: object
      properties:
        projectUuid:
          type: string
          example: "9f5c8c9a-8d5f-4a41-8cb4-6c8b3b5d12a1"
        name:
          type: string
          example: "Project-1"
        description:
          type: string
          example: "Project about Data Cleaning"
        createdAt:
          type: string
          example: "2026-06-11T11:40:00"
        datasetCount:
          type: integer
          example: 3
        experimentCount:
          type: integer
          example: 5
        experimentConfigCount:
          type: integer
          example: 8
        datasetVersionCount:
          type: integer
          example: 8
        experimentRunCount:
          type: integer
          example: 10
    ProjectStatusChangeRequestModel:
      type: object
      properties:
        status:
          type: string
          example: "ACTIVE"


